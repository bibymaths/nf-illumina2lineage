name: Auto Release on main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next SemVer patch tag (vMAJOR.MINOR.PATCH)
        id: next
        shell: bash
        run: |
          set -euo pipefail

          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

          # If no tag exists, start at v0.9.0 (your baseline)
          if [[ -z "${latest}" ]]; then
            next="v0.9.0"
          else
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<< "${ver}"
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          fi

          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "tag=${next}"      >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: tagcheck
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.next.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if GitHub release already exists
        if: steps.tagcheck.outputs.exists == 'false'
        id: relcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.next.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub release (normal release)
        if: steps.tagcheck.outputs.exists == 'false' && steps.relcheck.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.next.outputs.tag }}"

          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes

      - name: Summary
        shell: bash
        run: |
          echo "Latest tag: ${{ steps.next.outputs.latest }}"
          echo "Next tag:   ${{ steps.next.outputs.tag }}"
          echo "Tag exists: ${{ steps.tagcheck.outputs.exists }}"
          echo "Release exists: ${{ steps.relcheck.outputs.exists }}"