[workspace]
authors = ["bibymaths <mishraabhinav36@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "nf-illumina2lineage"
platforms = ["linux-64"]
version = "0.1.0"

# ==============================================================================
# Tasks
# ==============================================================================

[tasks]
run-pipeline = "nextflow run main.nf -profile pixi"
clean-nextflow = "rm -rf work .nextflow*"
check-nextflow = "nextflow -version"

# ==============================================================================
# Main pipeline runtime environment
# ==============================================================================

[feature.illumina2lineage]
channels = ["conda-forge", "bioconda"]

[feature.illumina2lineage.dependencies]
python = "3.10.*"
pip = "*"
snakemake-minimal = "==7.24.0"

# Core workflow/system tools
aria2 = "*"
wget = "*"
pigz = "*"

# Bioinformatics tools
fastqc = "*"
fastp = "*"
multiqc = "*"
minimap2 = "*"
samtools = "*"
bcftools = "1.17.*"
bedtools = "*"
freebayes = "*"
vcftools = "*"
bamclipper = "*"
mafft = "*"
iqtree = "*"
pangolin = "4.3.*"
pangolin-data = "*"
president = "*"

# Python/runtime libraries used by pipeline tools
biopython = "*"
pandas = "*"
pyyaml = "*"
requests = "*"
tqdm = "*"
click = "*"
rich = "*"
jinja2 = "*"
attrs = "*"
regex = "*"
pydantic = "*"
typing-extensions = "*"

# Other libraries/tools pulled from your original environment
dendropy = "*"
pulp = "*"
plotly = "*"
graphviz = "*"
htslib = "*"
gsl = "*"
k8 = "*"
screed = "*"
configargparse = "*"
argparse-dataclass = "*"
tabulate = "*"
six = "*"
zlib = "*"

# ==============================================================================
# Documentation / PyPI environment
# ==============================================================================

[feature.docs]
channels = ["conda-forge"]

[feature.docs.dependencies]
python = "3.10.*"
pip = "*"

[feature.docs.pypi-dependencies]
mkdocs = "==1.6.1"
mkdocs-material = "==9.7.6"
mkdocs-material-extensions = "==1.3.1"
pymdown-extensions = "==10.21.2"
mkdocs-get-deps = "==0.2.2"
ghp-import = "==2.1.0"
mergedeep = "==1.3.4"
paginate = "==0.5.7"
pathspec = "==1.1.1"
pyyaml-env-tag = "==1.1"
watchdog = "==6.0.0"
babel = "==2.18.0"
backrefs = "==7.0"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
docs-deploy = "mkdocs gh-deploy"

# ==============================================================================
# Environments
# ==============================================================================

[environments]
illumina2lineage = { features = ["illumina2lineage"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }